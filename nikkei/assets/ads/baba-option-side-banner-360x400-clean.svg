<svg xmlns="http://www.w3.org/2000/svg" width="360" height="400" viewBox="0 0 360 400" role="img" aria-labelledby="title desc">
  <title id="title">BABA Option refined side banner</title>
  <desc id="desc">A refined animated BABA Option right-rail banner sample for nikkeirealtime.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06101f"/>
      <stop offset="0.48" stop-color="#0c1a3d"/>
      <stop offset="1" stop-color="#07101c"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0" x2="1">
      <stop offset="0" stop-color="#77a7ff" stop-opacity="0"/>
      <stop offset="0.52" stop-color="#77a7ff" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#77a7ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#8bb6ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8bb6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="button" x1="0" x2="1">
      <stop offset="0" stop-color="#ffd955"/>
      <stop offset="1" stop-color="#f1b521"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <style>
      .brand-main { font-family: Arial, Helvetica, sans-serif; font-weight: 800; letter-spacing: 0; }
      .copy-main { font-family: "Yu Gothic", "Meiryo", Arial, sans-serif; font-weight: 800; letter-spacing: 0; }
      .copy-sub { font-family: "Yu Gothic", "Meiryo", Arial, sans-serif; font-weight: 600; letter-spacing: 0; }
      .label { font-family: Arial, Helvetica, sans-serif; font-weight: 700; letter-spacing: 0.9px; }
      .drift { animation: drift 8s ease-in-out infinite alternate; }
      .chart-line {
        stroke-dasharray: 380;
        stroke-dashoffset: 760;
        animation: lineFlow 4.6s ease-in-out infinite;
      }
      .chart-dot { animation: dotPulse 1.9s ease-in-out infinite; transform-origin: 295px 218px; }
      .live-dot { animation: livePulse 1.6s ease-in-out infinite; transform-origin: 288px 72px; }
      @keyframes drift {
        from { transform: translateX(-10px); opacity: 0.5; }
        to { transform: translateX(12px); opacity: 0.9; }
      }
      @keyframes lineFlow {
        0% { stroke-dashoffset: 760; opacity: 0.62; }
        42%, 72% { stroke-dashoffset: 380; opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.78; }
      }
      @keyframes dotPulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.42); opacity: 1; }
      }
      @keyframes livePulse {
        0%, 100% { opacity: 0.48; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .drift, .chart-line, .chart-dot, .live-dot { animation: none; }
      }
    </style>
  </defs>

  <rect width="360" height="400" fill="url(#bg)"/>

  <g class="drift" opacity="0.78">
    <path d="M220 -32h122L169 400H48z" fill="#2448dd" opacity="0.22"/>
    <path d="M311 -20h68L205 400h-66z" fill="#5f8cff" opacity="0.14"/>
    <circle cx="285" cy="80" r="96" fill="#4d75ff" opacity="0.12"/>
  </g>
  <rect x="0" y="86" width="360" height="1" fill="url(#softBlue)"/>
  <rect x="0" y="307" width="360" height="1" fill="url(#softBlue)" opacity="0.68"/>

  <g transform="translate(22 20)">
    <rect x="0" y="0" width="316" height="54" rx="0" fill="#081424" stroke="#244d9f"/>
    <rect x="15" y="14" width="28" height="26" rx="2" fill="#f7fbff" opacity="0.94"/>
    <rect x="19" y="18" width="20" height="18" fill="#081424"/>
    <text x="29" y="31.5" text-anchor="middle" fill="#ffd955" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800">BO</text>
    <text x="54" y="32" fill="#ffffff" class="brand-main" font-size="21">BABA</text>
    <text x="119" y="32" fill="#8fb4ff" class="brand-main" font-size="20">OPTION</text>
    <circle class="live-dot" cx="282" cy="19" r="4" fill="#2be07d"/>
    <text x="252" y="36" fill="#9fb1d2" class="label" font-size="8">LIVE SAMPLE</text>
  </g>

  <g transform="translate(24 99)">
    <text x="0" y="0" fill="#ffd955" class="label" font-size="10">SPONSORED</text>
    <text x="0" y="35" fill="#ffffff" class="copy-main" font-size="25">世界の値動きを</text>
    <text x="0" y="66" fill="#ffffff" class="copy-main" font-size="25">5秒からチェック。</text>
    <text x="0" y="92" fill="#b6c4df" class="copy-sub" font-size="12.5">FX、Gold、Bitcoin、指数まで。</text>
  </g>

  <g transform="translate(24 216)" filter="url(#shadow)">
    <rect x="0" y="0" width="312" height="86" fill="#07101d" stroke="#2f5599"/>
    <path d="M0 64h312M0 43h312M0 22h312M52 0v86M104 0v86M156 0v86M208 0v86M260 0v86" stroke="#375174" stroke-width="1" opacity="0.38"/>
    <path d="M16 63L42 55L67 60L91 46L116 50L141 36L166 40L191 28L216 33L241 24L268 28L296 18V86H16z" fill="url(#chartFill)"/>
    <path class="chart-line" d="M16 63L42 55L67 60L91 46L116 50L141 36L166 40L191 28L216 33L241 24L268 28L296 18" fill="none" stroke="#8fb4ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="chart-dot" cx="296" cy="18" r="4" fill="#31d77b"/>
    <rect x="226" y="10" width="54" height="20" fill="rgba(0,0,0,0.48)" stroke="#375174"/>
    <text x="253" y="24" text-anchor="middle" fill="#ffd955" class="label" font-size="11">WEB</text>
  </g>

  <g transform="translate(24 325)">
    <rect x="0" y="0" width="91" height="27" fill="rgba(255,255,255,0.065)" stroke="#274575"/>
    <text x="45.5" y="12" text-anchor="middle" fill="#ffd955" class="copy-sub" font-size="10">1ドルから</text>
    <text x="45.5" y="22" text-anchor="middle" fill="#9fb1d2" class="label" font-size="7.5">MIN TRADE</text>

    <rect x="108" y="0" width="91" height="27" fill="rgba(255,255,255,0.065)" stroke="#274575"/>
    <text x="153.5" y="12" text-anchor="middle" fill="#ffd955" class="copy-sub" font-size="10">70種類以上</text>
    <text x="153.5" y="22" text-anchor="middle" fill="#9fb1d2" class="label" font-size="7.5">ASSETS</text>

    <rect x="216" y="0" width="91" height="27" fill="rgba(255,255,255,0.065)" stroke="#274575"/>
    <text x="261.5" y="12" text-anchor="middle" fill="#ffd955" class="copy-sub" font-size="10">デモ口座</text>
    <text x="261.5" y="22" text-anchor="middle" fill="#9fb1d2" class="label" font-size="7.5">PRACTICE</text>
  </g>

  <g transform="translate(24 365)">
    <rect x="0" y="0" width="144" height="24" rx="12" fill="url(#button)"/>
    <text x="72" y="16.5" text-anchor="middle" fill="#121006" class="copy-main" font-size="11.5">公式サイトで確認</text>
    <text x="157" y="16" fill="#8ea3c7" class="copy-sub" font-size="9.5">取引にはリスクがあります</text>
  </g>
</svg>
